<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body>
    <nav>
        <h1>SRT Translator</h1>
    </nav>
    <main>
        <label class="upload-file message">
            Загрузить .srt файл
            <input type="file" accept=".srt" style="display:none;">
        </label>
        <p class="choice-msg message">Выберите языки для перевода:</p>
        <div class="choice-lang">
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Английский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Португальский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Хинди
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Испанский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Арабский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Въетнамский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Китайский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Узбекский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Итальянский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Немецкий
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Украинский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Корейский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Русский
            </label>
            <label class="checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
                Свой вариант (На англ)
            </label>
            <div class="choice-buttons">
                <a href="#" class="choose-all">Выбрать все</a>
                <a href="#" class="send">ОТПРАВИТЬ</a>
            </div>
        </div>

    </main>
    <footer></footer>
</body>
</html>
